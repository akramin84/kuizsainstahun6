<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Mega Sains Tahun 6</title>
    <style>
        :root {
            --primary: #008080;
            --secondary: #ff7f50;
            --dark: #2f4f4f;
            --light: #f4f7f6;
            --success: #2ec4b6;
            --danger: #e71d36;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #006666;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .q-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            background: #f9f9f9;
            border: 2px solid #eee;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover {
            background: #f0f7f7;
            border-color: var(--primary);
        }

        .option-item.selected {
            background: #e6f2f2;
            border-color: var(--primary);
        }

        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s;
        }

        .status-text {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
            text-align: right;
        }

        #result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--light);
            line-height: 150px;
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px auto;
            border: 5px solid var(--primary);
        }

        .loading {
            display: none;
            color: var(--secondary);
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<div class="container">

        <div class="form-group">
            <label for="student-name">Nama Penuh Murid:</label>
            <input type="text" id="student-name" placeholder="Sila masukkan nama anda..." required>
        </div>
        <div class="form-group">
            <label for="student-class">Kelas:</label>
            <input type="text" id="student-class" placeholder="Contoh: 6 Cerdas" required>
        </div>
        <button class="btn" onclick="startQuiz()">Mula Kuiz</button>
    </div>

    <div id="quiz-screen" style="display: none;">

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div id="questions-container"></div>
        
        <button class="btn" id="next-btn" onclick="nextQuestion()" style="margin-top: 20px;">Seterusnya</button>
    </div>

    <div id="result-screen">

</div>
